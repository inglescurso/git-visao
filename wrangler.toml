name = "git-visao"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

# keep_vars evita que deploys do GitHub removam variaveis e segredos configurados no Cloudflare Dashboard
keep_vars = true

[observability]
enabled = true

[vars]
ADMIN_PASSWORD = "admin"
OMNIROUTE_MODEL = "gemini-2.5-flash"
PUBLIC_APP_TITLE = "GitVisão • Catálogo Pega a Visão"

[[d1_databases]]
binding = "DB"
database_name = "git_visao_db"
database_id = "4ec3a001-57c8-4e0d-a9d0-f8b2934e55f9"
